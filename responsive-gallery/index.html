<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="A responsive photo gallery with theme and favorites controls.">
  <title>My Responsive Photo Gallery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>My Photo Gallery</h1>
    <p>A collection of landscapes, places, and everyday inspiration.</p>
  </header>

  <main>
    <div class="controls" id="gallery-controls" hidden>
      <button id="theme-button" type="button" aria-pressed="false">
        Switch to Dark Mode
      </button>

      <button id="favorites-button" type="button" aria-pressed="false">
        Show Favorites Only
      </button>
    </div>

    <p id="gallery-status" role="status"></p>

    <section id="gallery" class="gallery" aria-label="Photo gallery">
      <!-- These photos remain available when JavaScript is disabled. -->
      <figure>
        <img
          src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&auto=format&fit=crop&q=80"
          alt="A mountain lake surrounded by dramatic peaks"
          width="800" height="600">
        <figcaption>Mountain Lake</figcaption>
      </figure>

      <figure>
        <img
          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&auto=format&fit=crop&q=80"
          alt="Sunlight filtering through a green forest"
          width="800" height="600">
        <figcaption>Forest Sunlight</figcaption>
      </figure>

      <figure>
        <img
          src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800&auto=format&fit=crop&q=80"
          alt="A landscape glowing in warm sunrise light"
          width="800" height="600">
        <figcaption>Morning Light</figcaption>
      </figure>
    </section>

    <noscript>
      <p>
        You can browse the photos without JavaScript.
        Enable JavaScript to use theme switching and favorites filtering.
      </p>
    </noscript>
  </main>

  <footer>
    <p>Kehinde Oluwaseye Onifade | Responsive Gallery Exercise</p>
    <p>Photos hosted on Unsplash.</p>
  </footer>
</body>
</html>
